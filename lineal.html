<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algoritmo Lineal</title>
    <link rel="stylesheet" href="lineal.css" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <div class="container">
      <h2>Algoritmo Lineal</h2>

      <div class="form-group">
        <label for="x0">X₀:</label>
        <input type="number" id="x0" value="2" />

        <label for="k">k:</label>
        <input type="number" id="k" value="3" />

        <label for="c">c:</label>
        <input type="number" id="c" value="7" />

        <label for="p">P:</label>
        <input type="number" id="p" value="8" />

        <label for="d"> D:</label>
        <input type="number" id="d" value="4" />
      </div>

      <div class="buttons">
        <button onclick="generar()">Generar</button>
        <button onclick="limpiar()">Limpiar</button>
      </div>

      <div
        id="params"
        style="margin-top: 15px; font-weight: bold; text-align: center"
      ></div>

      <table id="tabla">
        <thead>
          <tr>
            <th>i</th>
            <th>Xᵢ₋₁</th>
            <th>Operación</th>
            <th>Xᵢ</th>
            <th>rᵢ</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="lineal.js"></script>
  </body>
</html>
