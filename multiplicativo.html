<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algoritmo Congruencial Multiplicativo</title>
    <link rel="stylesheet" href="multiplicativo.css" />
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <div id="navbar"></div>
    <div class="container">
      <h2>Algoritmo Congruencial Multiplicativo</h2>

      <!-- Parámetros -->
      <div class="form-group">
        <label for="x0">X₀:</label>
        <input type="number" id="x0" value="5" />

        <label for="k">k:</label>
        <input type="number" id="k" value="3" />

        <label for="aTipo">a:</label>
        <select id="aTipo">
          <option value="3">3 + 8k</option>
          <option value="5">5 + 8k</option>
        </select>

        <label for="p">P:</label>
        <input type="number" id="p" value="10" />

        <label for="d">D:</label>
        <input type="number" id="d" value="4" />
      </div>

      <!-- Botones -->
      <div class="buttons">
        <button onclick="generar()">Generar</button>
        <button onclick="limpiar()">Limpiar</button>
      </div>

      <!-- Mostrar parámetros -->
      <div
        id="params"
        style="margin-top: 15px; font-weight: bold; text-align: center"
      ></div>

      <!-- Tabla de resultados -->
      <table id="tabla">
        <thead>
          <tr>
            <th>i</th>
            <th>Xᵢ₋₁</th>
            <th>Operación</th>
            <th>Xᵢ</th>
            <th>rᵢ</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="multiplicativo.js"></script>
  </body>
</html>
